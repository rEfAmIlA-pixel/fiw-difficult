<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FIW 亲缘实验谱 · experiences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #dfe8e2;
      --paper-2: #f3f7f4;
      --ink: #17221c;
      --ink-soft: #3a4a41;
      --line: #8aa090;
      --blood: #a33a3a;
      --sage: #2f6b52;
      --dust: #7a6a58;
      --gold: #b0892e;
      --sky: #2c6a86;
      --chip: #c5d4cb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "IBM Plex Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #cfe0d4 0%, transparent 55%),
        var(--paper);
      line-height: 1.5;
    }
    a { color: var(--sky); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 24px 80px; }
    header.hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 28px;
      align-items: end;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    h1 {
      font-family: "IBM Plex Serif", serif;
      font-size: clamp(2rem, 4vw, 3.1rem);
      font-weight: 600;
      line-height: 1.15;
      margin: 8px 0 10px;
      text-wrap: balance;
    }
    .lede { max-width: 62ch; color: var(--ink-soft); margin: 0; }
    .best {
      min-width: 240px;
      padding: 16px 18px 14px;
      background: var(--paper-2);
      border: 1px solid #b7c7bc;
    }
    .best b {
      font-family: "IBM Plex Serif", serif;
      font-size: 2.4rem;
      font-weight: 600;
      color: var(--blood);
      display: block;
      line-height: 1;
    }
    .best span { font-size: 13px; color: var(--ink-soft); }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 22px 0 8px;
    }
    .filters button {
      font: 500 13px/1 "IBM Plex Sans", sans-serif;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper-2);
      border-color: var(--ink);
    }
    .chart-box {
      margin: 18px 0 36px;
      background: var(--paper-2);
      border: 1px solid #b7c7bc;
      padding: 16px 12px 8px;
    }
    .chart-box h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 12px 8px;
      letter-spacing: 0.04em;
    }
    svg.auc { width: 100%; height: 220px; display: block; }
    .legend {
      display: flex; gap: 16px; font-size: 12px; color: var(--ink-soft);
      padding: 4px 12px 10px;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .run {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 18px;
      padding: 26px 0;
      border-bottom: 1px dashed var(--line);
    }
    .run:last-child { border-bottom: 0; }
    .idx {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--ink-soft);
      padding-top: 6px;
    }
    .idx em {
      display: block;
      font-style: normal;
      font-family: "IBM Plex Serif", serif;
      font-size: 22px;
      color: var(--ink);
      margin-top: 2px;
    }
    h3 {
      font-family: "IBM Plex Serif", serif;
      font-size: 1.35rem;
      margin: 0 0 6px;
      font-weight: 600;
    }
    .meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
    .badge {
      display: inline-block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      margin-right: 6px;
      vertical-align: 2px;
    }
    .up { background: #d7efe3; color: #1d5c3d; }
    .flat { background: #e7e3d4; color: #5c5340; }
    .down { background: #f3d6d2; color: #7a2e2e; }
    .runn { background: #d5e8f1; color: #1d4f66; }
    .skip { background: #eadfcb; color: #6a5428; }
    .ctrl { background: #e2e2e2; color: #444; }
    .change, .notes {
      max-width: 72ch;
      font-size: 15px;
      margin: 0 0 10px;
    }
    .notes { color: var(--ink-soft); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
      gap: 8px 12px;
      margin: 12px 0 10px;
    }
    .metric dt {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .metric dd {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 16px;
      font-weight: 500;
    }
    .rels {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12.5px;
      color: var(--ink-soft);
      margin: 0 0 8px;
    }
    .path {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--dust);
      word-break: break-all;
    }
    footer {
      margin-top: 40px;
      font-size: 12px;
      color: var(--ink-soft);
    }
    @media (max-width: 720px) {
      header.hero { grid-template-columns: 1fr; }
      .run { grid-template-columns: 1fr; gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div>
        <div class="kicker">FIW · Track I · 亲子四类</div>
        <h1>实验谱：每一次改动，不论成败</h1>
        <p class="lede">
          多粒度模糊亲缘验证。当前最好是 AdaFace 余弦与 112-MLP 加权融合（官方 Test 四类平均 0.8394）。
          说明与评测表见本目录 <code>说明文档.md</code>、<code>评测结果.md</code>。年龄与 11 类分路各自记在对应目录。
        </p>
      </div>
      <div class="best">
        <span>亲子四类最好 Test AUC</span>
        <b>0.8394</b>
        <span>加权融合 · α=0.60</span>
      </div>
    </header>

    <div class="filters" role="toolbar" aria-label="筛选实验">
      <button type="button" data-f="all" aria-pressed="true">全部 23 轮</button>
      <button type="button" data-f="up" aria-pressed="false">涨点</button>
      <button type="button" data-f="down" aria-pressed="false">失败 / 更差</button>
      <button type="button" data-f="flat" aria-pressed="false">持平</button>
      <button type="button" data-f="runn" aria-pressed="false">进行中</button>
    </div>

    <div class="chart-box">
      <h2>有官方测试的轮次 · Test AUC（亲子四类平均）</h2>
      <svg class="auc" viewBox="0 0 1000 220" role="img" aria-label="测试 AUC 折线">
        <line x1="48" y1="20" x2="48" y2="180" stroke="#8aa090" />
        <line x1="48" y1="180" x2="980" y2="180" stroke="#8aa090" />
        <text x="8" y="28" font-size="11" fill="#3a4a41" font-family="IBM Plex Mono, monospace">0.86</text>
        <text x="8" y="104" font-size="11" fill="#3a4a41" font-family="IBM Plex Mono, monospace">0.76</text>
        <text x="8" y="180" font-size="11" fill="#3a4a41" font-family="IBM Plex Mono, monospace">0.66</text>
        <polyline id="auc-line" fill="none" stroke="#a33a3a" stroke-width="2.2" points="" />
        <g id="auc-pts"></g>
      </svg>
      <div class="legend">
        <span><i class="dot" style="background:#a33a3a"></i>已评测 Test AUC</span>
        <span><i class="dot" style="background:#7a6a58"></i>未评测 / 崩掉（不进折线）</span>
      </div>
    </div>

    <div id="runs"></div>
    <footer>数据来自本目录 experiences.txt · 打开本文件即可离线查看 · 不依赖训练脚本</footer>
  </div>

      },
      {

      },
      {

        notes: "对照余弦融合 0.8394→0.8211。AdaFace 一路从 0.778 换成 0.748，融合跟着掉。丢掉浅头。主结果仍用 python eval_fusion.py。",

    const yMap = v => 180 - (v - 0.66) / 0.20 * 160;
    const tested = runs.map((r, i) => ({ r, i })).filter(x => typeof x.r.test === "number" && x.r.chart !== false);
    const line = document.getElementById("auc-line");
    const pts = document.getElementById("auc-pts");
    const xs = tested.map((_, k) => 48 + k * (932 / Math.max(tested.length - 1, 1)));
    line.setAttribute("points", tested.map((x, k) => xs[k] + "," + yMap(x.r.test)).join(" "));
    tested.forEach((x, k) => {
      const cx = xs[k], cy = yMap(x.r.test);
      pts.innerHTML += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="#a33a3a" />
        <text x="${cx}" y="198" text-anchor="middle" font-size="10" font-family="IBM Plex Mono, monospace" fill="#3a4a41">${x.r.test.toFixed(3)}</text>
        <text x="${cx}" y="212" text-anchor="middle" font-size="9" font-family="IBM Plex Sans, sans-serif" fill="#3a4a41">${x.i + 1}</text>`;
    });

    function fmt(v, d=4) { return typeof v === "number" ? v.toFixed(d) : "—"; }
    function card(r, n) {
      const metrics = [
        ["Val AUC", r.val], ["Test AUC", r.test], ["噪声 AUC", r.noise],
        ["ACC@best", r.accb], ["ACC@0.5", r.acc05], ["EER", r.eer], ["性别", r.gender]
      ].filter(x => x[1] != null);
      return `<article class="run" data-tag="${r.tag}">
        <div class="idx">#${String(n).padStart(2,"0")}<em>${r.date}</em></div>
        <div>
          <h3><span class="badge ${r.tag}">${r.tagLabel}</span>${r.id}</h3>
          <p class="meta">${r.setup}</p>
          <p class="change">${r.change}</p>
          ${metrics.length ? `<dl class="grid">${metrics.map(([k,v]) =>
            `<div class="metric"><dt>${k}</dt><dd>${fmt(v)}</dd></div>`).join("")}</dl>` : ""}
          ${r.rel ? `<p class="rels">${r.rel}</p>` : ""}
          <p class="notes">${r.notes}</p>
          <p class="path">${r.w}</p>
        </div>
      </article>`;
    }
    const root = document.getElementById("runs");
    root.innerHTML = runs.map((r, i) => card(r, i + 1)).join("");

    document.querySelectorAll(".filters button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        const f = btn.dataset.f;
        document.querySelectorAll(".run").forEach(el => {
          el.style.display = (f === "all" || el.dataset.tag === f) ? "" : "none";
        });
      });
    });
  </script>
</body>
